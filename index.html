
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa Permai</title>
</head>
<body>

    <!-- Bagian Header -->
    <header>
        <div class="logo">
            <h2>Villa Permai</h2>
        </div>

        <nav>
            <ul>
                <li><a href="#beranda">Beranda</a></li>
                <li><a href="#villas">Villa</a></li>
                <li><a href="#pesan">Pesan</a></li>
            </ul>
        </nav>
    </header>

    <!-- Bagian Beranda -->
    <main>
        <section id="beranda" class="hero">
            <div class="hero-content">
                <h1>Selamat Datang di Villa Permai</h1>

                <p>
                    Nikmati pengalaman menginap yang nyaman,
                    tenang, dan menyenangkan bersama keluarga.
                </p>

                <a href="#villas" class="btn-pesan">
                    Lihat Villa
                </a>
            </div>
        </section>

        <!-- Bagian Daftar Villa -->
        <section id="villas" class="villas-section">
            <div class="container">

                <h2 class="section-title">Villa Kami</h2>

                <!-- Kolom Pencarian Villa -->
                <div class="search-bar">
                    <input
                        type="text"
                        id="searchInput"
                        class="search-input"
                        placeholder="Cari nama atau lokasi villa..."
                    >

                    <button
                        type="button"
                        id="filterBtn"
                        class="btn btn--outline"
                    >
                        Cari
                    </button>
                </div>

                <!-- Tempat Menampilkan Daftar Villa -->
                <div id="villaList" class="villa-list">
                </div>

                <!-- Pesan Jika Villa Tidak Ditemukan -->
                <div id="villaEmpty" class="villa-empty">
                    Tidak ada villa yang cocok dengan pencarian Anda.
                </div>

            </div>
        </section>

    </main>

</body>
</html>
